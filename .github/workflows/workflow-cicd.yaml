name: Workflow CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      security-events: write # pour la mise à jour de l'onglet Security and quality
      contents: read # lire le code source

    steps:
      - name: Clonage du dépôt
        uses: actions/checkout@v7

      - name: Version Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Sauvegarder le rapport JaCoCo
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Générer le site Maven
        run: mvn site

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v5
        with:
          name: rapport-checkstyle
          path: target/site/

      - name: Publier le rapport SpotBugs
        uses: actions/upload-artifact@v5
        with:
          name: rapport-spotbugs
          path: target/spotbugs/


name: Workflow CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      security-events: write # pour la mise à jour de l'onglet Security and quality
      contents: read # lire le code source

    steps:
      - name: Clonage du dépôt
        uses: actions/checkout@v7

      - name: Version Java
        uses: actions/setup-jave@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean package -DskipTests

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

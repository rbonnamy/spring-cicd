name: Configurer Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Configuration de Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Afficher version java
        run: java -version

      - name: Afficher version maven
        run: mvn -version